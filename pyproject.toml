[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affa"
version = "0.1.0"
description = "Agentic Financial Filing Analyst - traceable, rubric-based analysis of SEC filings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Agentic Financial Filing Analyst contributors" }]
keywords = ["rag", "langgraph", "sec-filings", "xbrl", "finance", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

# Core install stays deliberately light: schema, config, cleaning, chunking,
# unit normalisation, rubric and routing must import without torch installed,
# so the unit suite runs in CI in seconds.
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Document ingestion (parsers + sentence segmentation + vector store).
ingest = [
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "spacy>=3.7",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
]
# Agent graph + serving.
agent = [
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "streamlit>=1.33",
]
# Evaluation harnesses.
eval = [
  "seqeval>=1.2.2",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "datasets>=2.19,<4.0",
  "transformers>=4.40,<5.0",
]
# Fine-tuning. `datasets<4.0` is REQUIRED, not preference: finer-139 and
# financial_phrasebank are loading-script datasets and datasets>=4.0 removed
# script execution entirely. See docs/DATASETS.md.
train = [
  "torch>=2.1",
  "transformers>=4.40,<5.0",
  "datasets>=2.19,<4.0",
  "accelerate>=0.30",
  "sentence-transformers>=3.0",
  "peft>=0.11",
  "bitsandbytes>=0.43",
  "seqeval>=1.2.2",
  "scikit-learn>=1.3",
  "evaluate>=0.4",
]
hosted = ["anthropic>=0.40", "openai>=1.30"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "httpx>=0.27",
]

[project.scripts]
affa-analyze = "affa.cli:main"
affa-eval = "affa.eval.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
affa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from a clean checkout without an editable install, and
# identically on Windows and POSIX (the PYTHONPATH separator differs).
pythonpath = ["src", "."]
markers = [
  "heavy: requires torch / network / model downloads (deselected by default in CI)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import inside cells by design; a cell is not a module.
"notebooks/*.ipynb" = ["E402"]
# Training entry points must extend sys.path before importing the package,
# so their project imports cannot come first.
"training/train_*.py" = ["E402"]
